name: release

# 手动发版：推 v* tag 或手动触发。不随 main 推送自动发版，
# 免得写一半的代码被发出去了。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o home-broadband .

      - name: 打包
        run: |
          tar czf "home-broadband-linux-${{ matrix.goarch }}.tar.gz" \
            home-broadband scripts/install.sh scripts/h.sh deploy/home-broadband.service README.md

      - uses: actions/upload-artifact@v4
        with:
          name: home-broadband-linux-${{ matrix.goarch }}
          path: home-broadband-linux-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 生成校验和
        run: sha256sum home-broadband-linux-*.tar.gz > checksums.txt

      - name: 写中文更新说明
        run: |
          cur="${GITHUB_REF_NAME}"
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${cur}$" | head -1)
          {
            echo "## 更新内容"
            echo
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "${prev}..${cur}"
            else
              git log --pretty='- %s' "$cur" | head -20
            fi
          } > release_notes.txt
          cat release_notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            home-broadband-linux-*.tar.gz
            checksums.txt
